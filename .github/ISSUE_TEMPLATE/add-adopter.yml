name: 将我的项目添加到采用者列表
description: 在展示页和 docs/adopters.md 中列出你的循环配置
title: "采用者："
labels:
  - docs
body:
  - type: markdown
    value: |
      请分享你如何运行本仓库中的循环（或其改编版本）。我们会将你的项目添加到 [docs/adopters.md](https://github.com/cobusgreyling/loop-engineering/blob/main/docs/adopters.md) 和[展示页采用者墙](https://cobusgreyling.github.io/loop-engineering/#adopters)。

      **可选：** 粘贴由 `npx @cobusgreyling/loop-audit . --badge` 生成的 Loop Ready 徽章。

  - type: input
    id: project
    attributes:
      label: 项目
      description: 仓库 URL 或产品名称
      placeholder: https://github.com/you/your-repo
    validations:
      required: true

  - type: input
    id: patterns
    attributes:
      label: 模式
      description: 例如每日问题分诊 + Issue 问题分诊
      placeholder: daily-triage, issue-triage
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: 主要工具
      options:
        - Grok
        - Claude Code
        - Codex
        - Cursor
        - Windsurf
        - GitHub Actions
        - Mixed
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: 就绪度等级（请如实选择）
      options:
        - L1
        - L2
        - L3
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 一句话说明
      description: 哪些做法有效、哪些环节失败——也欢迎分享失败经验
      placeholder: 使用 L1 每日问题分诊 2 周；token 用量突增后停用了 CI 清扫循环
    validations:
      required: true

  - type: textarea
    id: badge
    attributes:
      label: Loop Ready 徽章（可选）
      description: "`npx @cobusgreyling/loop-audit . --badge` 的输出"
      render: text
      placeholder: "[![Loop Ready L2 (58/100)](...)](...)"
